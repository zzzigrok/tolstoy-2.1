<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Purple Gradient for Network Connections -->
    <linearGradient id="netGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>

    <!-- Vibrant Cyan Glow Filter for Nodes -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LEFT SIDE: Geometric Neural Network Lines -->
  <path d="
    M 130 380 L 105 345 L 90 290
    M 175 335 L 135 305 L 110 230
    M 220 285 L 175 250 L 145 175
    M 265 235 L 220 195 L 195 125
    M 310 185 L 275 145 L 255 85
    M 350 140 L 325 105 L 310 60
    M 385 105 L 365 75

    M 105 345 L 135 305 L 175 250 L 220 195 L 275 145 L 325 105 L 365 75
    M 90 290 L 110 230 L 145 175 L 195 125 L 255 85 L 310 60
    M 310 60 L 365 75
    M 365 75 L 400 100

    M 130 380 L 135 305
    M 175 335 L 175 250
    M 220 285 L 220 195
    M 265 235 L 275 145
    M 310 185 L 325 105
    M 350 140 L 365 75
    M 385 105 L 400 100

    M 105 345 L 110 230
    M 135 305 L 145 175
    M 175 250 L 195 125
    M 220 195 L 255 85
    M 275 145 L 310 60
    M 325 105 L 310 60

    M 90 290 L 80 280
    M 110 230 L 95 210
    M 145 175 L 130 150
    M 195 125 L 180 100
    M 255 85 L 235 65
    
    M 80 280 L 95 210 L 130 150 L 180 100 L 235 65 L 310 60
    
    M 80 280 L 110 230
    M 95 210 L 145 175
    M 130 150 L 195 125
    M 180 100 L 255 85
    M 235 65 L 310 60
    "
    stroke="url(#netGrad)" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- RIGHT SIDE: Traditional Feather Silhouette -->
  <path d="M 400,100 
           C 420,130 435,170 425,200 
           L 405,190 L 420,215 
           C 440,250 420,280 400,310 
           L 360,290 L 380,325 
           C 330,400 220,430 90,430 
           C 170,380 260,280 400,100 Z" 
        fill="#ffffff" />

  <!-- CENTRAL SHAFT -->
  <path d="M 65,455 L 90,430 C 170,380 260,280 400,100" 
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- NEURAL NETWORK NODES -->
  <g fill="#22d3ee" filter="url(#cyanGlow)">
    <circle cx="130" cy="380" r="3.5"/>
    <circle cx="175" cy="335" r="3.5"/>
    <circle cx="220" cy="285" r="3.5"/>
    <circle cx="265" cy="235" r="3.5"/>
    <circle cx="310" cy="185" r="3.5"/>
    <circle cx="350" cy="140" r="3.5"/>
    <circle cx="385" cy="105" r="3.5"/>
    
    <circle cx="105" cy="345" r="2.5"/>
    <circle cx="135" cy="305" r="2.5"/>
    <circle cx="175" cy="250" r="2.5"/>
    <circle cx="220" cy="195" r="2.5"/>
    <circle cx="275" cy="145" r="2.5"/>
    <circle cx="325" cy="105" r="2.5"/>
    <circle cx="365" cy="75" r="2.5"/>
    
    <circle cx="90" cy="290" r="2"/>
    <circle cx="110" cy="230" r="2"/>
    <circle cx="145" cy="175" r="2"/>
    <circle cx="195" cy="125" r="2"/>
    <circle cx="255" cy="85" r="2"/>
    <circle cx="310" cy="60" r="2"/>
    
    <circle cx="80" cy="280" r="1.5"/>
    <circle cx="95" cy="210" r="1.5"/>
    <circle cx="130" cy="150" r="1.5"/>
    <circle cx="180" cy="100" r="1.5"/>
    <circle cx="235" cy="65" r="1.5"/>
    
    <circle cx="400" cy="100" r="2"/>
  </g>
</svg>
